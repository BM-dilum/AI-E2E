name: Auto Create PR

on:
    push:
        branches-ignore:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    test-and-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

            - name: Install dependencies
              run: npm install

            - name: Compile contracts
              run: npx hardhat compile

            - name: Run tests
              run: npx hardhat test

            - name: Create PR if tests pass
              if: success()
              uses: actions/github-script@v7
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const branch = context.ref.replace('refs/heads/', '')

                        const prTitle = branch
                        .replace(/^feat\//, '')
                        .replace(/-/g, ' ')
                        .replace(/\b\w/g, l => l.toUpperCase())

                        const body = [
                        '## Summary',
                        'Auto generated PR from branch: `' + branch + '`',
                        '',
                        '## Tests',
                        'All tests passed before this PR was opened !',
                        '',
                        '## CodeRabbit',
                        'CodeRabbit will automatically review this PR...'
                        ].join('\n')

                        //get default branch
                        const {data: repoData} = await github.rest.repos.get({
                            owner: context.repo.owner,
                            repo: context.repo.repo
                        })
                        const defaultBranch = repoData.default_branch

                        const { data: prs } = await github.rest.pulls.list({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        head: context.repo.owner + ':' + branch,
                        state: 'open'
                        })

                        if (prs.length === 0) {
                        await github.rest.pulls.create({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            title: prTitle,
                            head: branch,
                            base: defaultBranch,
                            body: body
                        })
                        }
            - name: Trigger CodeRabbit Review
              if: success()
              uses: actions/github-script@v7
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN}}
                  script: |
                      const branch = context.ref.replace("refs/heads/", "")

                      const {data: prs} = await github.rest.pulls.list({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          head: context.repo.owner + ":" + branch,
                          state: "open"
                      })

                      if (prs.length > 0) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: prs[0].number,
                              body: "@coderabbitai review"})
                      }
