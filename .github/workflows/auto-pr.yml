name: Auto Create PR

on:
    push:
        branches-ignore:
            - main

jobs:
    test-and-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm install

            - name: Compile contracts
              run: npx hardhat compile

            - name: Run tests
              run: npx hardhat test

            - name: Create PR if tests pass
              if: success()
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const branch = context.ref.replace('refs/heads/', '')

                      // generate meaningful PR name from branch name
                      const prTitle = branch
                        .replace(/-/g, ' ')
                        .replace(/\b\w/g, l => l.toUpperCase())

                      await github.rest.pulls.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: prTitle,
                        head: branch,
                        base: 'main',
                        body: [
                      '## Summary',
                      `Auto generated PR from branch: \`${branch}\``,
                      '',
                      '## Tests',
                      '✅ All tests passed before this PR was opened',
                      '',
                      '## CodeRabbit',
                      'CodeRabbit will automatically review this PR.'
                      ].join('\n')
