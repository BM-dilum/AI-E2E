name: Copilot Auto Fix

on:
    pull_request_review:
        types: [submitted]

jobs:
    auto-fix:
        if: contains(github.event.review.user.login, 'coderabbit')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout,
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.ref}}
                  fetch-depth: 0
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

            - name: Setup Git,
              run: |
                  git config --global user.name "github-actions"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Setup Node,
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

            - name: Install dependencies
              run: |
                  cd .github/scripts
                  npm install @octokit/rest groq-sdk typescript tsx @types/node

            - name: Run fix script,
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  REPO_OWNER: ${{ github.repository_owner }}
                  REPO_NAME: ${{ github.event.repository.name }}
                  REPO_ROOT: ${{ github.workspace }}
              run: |
                  cd .github/scripts 
                  npx tsx fix-comments.ts

            - name: Commit and Push changes
              if: success()
              run: |
                  git add .
                  git diff --staged --quiet || git commit -m "fix: address CodeRabbit comments"  
                  git push origin ${{ github.event.pull_request.head.ref }}

            - name: Trigger CodeRabbit Review
              if: success()
              uses: actions/github-script@v7
              env:
                  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN}}
                  script: |
                      const prNumber = context.payload.pull_request.number

                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: prNumber,
                              body: "@coderabbitai review"})
