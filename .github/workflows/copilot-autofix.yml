name: Copilot Auto Fix

on:
    pull_request_review:
        types: [submitted]
jobs:
    auto-fix:
        if: |
            (github.event_name == 'pull_request_review' && 
            contains(github.event.review.user.login, '@coderabbit'))

        runs-on: ubuntu-latest
        steps:
            - name: Debug event payload
              run: |
                  echo "Event: ${{ github.event_name }}"                  
                  echo "User: ${{ github.event.review.user.login  }}"

            - name: Trigger Copilot to fix review comments
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.pull_request.number,
                        body: "@copilot please address all CodeRabbit review comments and update this PR"
                      });
